<!-- @dsCard group="Colors" viewport="700x300" name="Glass — floating chrome" subtitle="The only translucency in the system: nav, dock, swipe actions" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-ui);background:var(--bg-page);color:var(--text-primary)}.stage{position:relative;height:300px;overflow:hidden}.under{padding:16px 20px 0}.under h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)}.row{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--separator);font-size:15px;font-weight:600}.row span{font-family:var(--font-mono);color:var(--text-secondary);font-size:13px}.dock{position:absolute;left:12px;right:12px;bottom:82px;display:flex;gap:8px;align-items:center;padding:10px;border-radius:22px;background:var(--glass-fill-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}.cta{flex:1;height:54px;border:none;border-radius:16px;background:var(--accent);color:var(--bf-black);font-family:var(--font-ui);font-size:17px;font-weight:600}.sq{width:54px;height:54px;border-radius:16px;background:var(--glass-highlight);border:1px solid var(--glass-border)}.nav{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:var(--glass-fill);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow)}.nav b{display:grid;place-items:center;min-height:52px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.01em;color:var(--text-tertiary)}.nav b.on{background:var(--glass-highlight);color:var(--accent-text)}.note{position:absolute;right:16px;top:14px;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);text-align:right;line-height:1.6}</style></head><body>
<div class="stage">
<div class="under">
<h4>The work</h4>
<div class="row">Lat pulldown <span>3×8 · 50 kg</span></div>
<div class="row">Cable row <span>4×8 · 64 kg</span></div>
<div class="row">Barbell curl <span>4×8 · 30 kg</span></div>
<div class="row">Hammer curls <span>3×12 · 15 kg</span></div>
</div>
<div class="note">--glass-fill<br>--glass-border<br>--glass-blur<br>--glass-shadow</div>
<div class="dock"><button class="cta" type="button">Start workout</button><button class="sq" type="button" aria-label="Edit"></button><button class="sq" type="button" aria-label="Add"></button></div>
<div class="nav"><b class="on">Workout</b><b>Body</b><b>Targets</b><b>Log</b></div>
</div></body></html>
