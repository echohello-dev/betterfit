<!-- @dsCard group="Colors" viewport="700x180" name="Status without hue" subtitle="Brightness plus wording carries meaning — no red, amber or green" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px}.sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:48px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body>
<div class="g">
<div class="sw"><i style="background:var(--success)"></i><b>Success</b><code>--success #FFE860</code></div>
<div class="sw"><i style="background:var(--warning)"></i><b>Warning</b><code>--warning #FFD60A</code></div>
<div class="sw"><i style="background:var(--info)"></i><b>Information</b><code>--info #C9A800</code></div>
<div class="sw"><i style="background:var(--danger)"></i><b>Danger</b><code>--danger = inverted</code></div>
</div>
<div style="margin-top:12px;font-size:var(--text-caption);color:var(--text-secondary);text-wrap:pretty">Danger has no hue of its own: destructive controls invert (white fill, black label on dark). Every status is written out in words, so removing colour removes nothing.</div>
</body></html>
