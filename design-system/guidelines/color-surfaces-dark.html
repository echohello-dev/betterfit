<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces dark</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body><div class="g">

<div class="sw"><i style="background:var(--grey-900);"></i><b>Elevated</b><code>--bg-elevated #131316</code></div>
<div class="sw"><i style="background:var(--grey-880);"></i><b>Surface</b><code>--surface #17171B</code></div>
<div class="sw"><i style="background:var(--grey-850);"></i><b>Raised</b><code>--surface-raised #1F1F25</code></div>
<div class="sw"><i style="background:rgba(255,255,255,.07);"></i><b>Border</b><code>--border rgba(255,255,255,.07)</code></div>
</div></body></html>
