<!-- @dsCard group="Colors" viewport="700x230" name="Light and dark" subtitle="Same two colours, mirrored neutrals — [data-scheme] switches everything" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-ui)}.pane{padding:20px;display:flex;flex-direction:column;gap:12px;background:var(--bg-page);color:var(--text-primary)}.wrap{display:grid;grid-template-columns:1fr 1fr}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:14px}.cta{height:44px;border-radius:var(--radius-button);background:var(--accent);color:var(--text-on-accent);display:grid;place-items:center;font-weight:600;font-size:15px}.lab{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-secondary)}</style></head><body>
<div class="wrap">
<div class="pane"><div class="lab">Dark — default</div><div class="card"><div style="font-family:var(--font-display);font-size:22px;letter-spacing:-.02em">Pull B</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px">5 exercises · 42 min</div></div><div class="cta">Start workout</div><a href="#" style="font-size:13px;font-weight:600">Swap exercise</a></div>
<div class="pane" data-scheme="light"><div class="lab">Light</div><div class="card"><div style="font-family:var(--font-display);font-size:22px;letter-spacing:-.02em">Pull B</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px">5 exercises · 42 min</div></div><div class="cta">Start workout</div><a href="#" style="font-size:13px;font-weight:600">Swap exercise</a></div>
</div></body></html>
