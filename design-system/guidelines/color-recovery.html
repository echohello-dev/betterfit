<!-- @dsCard group="Colors" viewport="700x180" name="Recovery scale" subtitle="Brightest = recovered, dimmest = sore. Never the only signal" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px}.sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:52px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body>
<div class="g">
<div class="sw"><i style="background:var(--recovery-recovered)"></i><b>Recovered</b><code>--recovery-recovered</code></div>
<div class="sw"><i style="background:var(--recovery-fresh)"></i><b>Fresh</b><code>--recovery-fresh</code></div>
<div class="sw"><i style="background:var(--recovery-fatigued)"></i><b>Fatigued</b><code>--recovery-fatigued</code></div>
<div class="sw"><i style="background:var(--recovery-sore)"></i><b>Sore</b><code>--recovery-sore</code></div>
</div>
<div style="margin-top:12px;font-size:var(--text-caption);color:var(--text-secondary);text-wrap:pretty">Readiness reads as brightness, which survives greyscale and colour blindness. The written status always sits beside the swatch — "Chest · Sore".</div>
</body></html>
