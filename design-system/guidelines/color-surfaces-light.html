<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces light</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body><div data-scheme="light" style="background:var(--bg-page);color:var(--text-primary);margin:-20px;padding:20px"><div class="g">
<div class="sw"><i style="background:#F6F6F8;"></i><b>Page</b><code>--bg-page #F6F6F8</code></div>
<div class="sw"><i style="background:#FFFFFF;"></i><b>Elevated</b><code>--bg-elevated #FFFFFF</code></div>
<div class="sw"><i style="background:#FFFFFF;"></i><b>Surface</b><code>--surface #FFFFFF</code></div>
<div class="sw"><i style="background:#EFEFF3;"></i><b>Raised</b><code>--surface-raised #EFEFF3</code></div>
<div class="sw"><i style="background:rgba(0,0,0,.08);"></i><b>Border</b><code>--border rgba(0,0,0,.08)</code></div>
</div></div></body></html>
