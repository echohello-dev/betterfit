<!-- @dsCard group="Motion" viewport="700x190" name="Duration & easing" subtitle="Short and responsive; no ambient loops" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px;font-size:var(--text-footnote)">
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Press feedback</span><code style="font-family:var(--font-mono);color:var(--text-secondary)">--dur-press 120ms</code></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Standard ease</span><code style="font-family:var(--font-mono);color:var(--text-secondary)">--ease-out</code></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>State change</span><code style="font-family:var(--font-mono);color:var(--text-secondary)">--dur-fast 180ms</code></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Snappy (progress)</span><code style="font-family:var(--font-mono);color:var(--text-secondary)">--ease-snappy</code></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Transition</span><code style="font-family:var(--font-mono);color:var(--text-secondary)">--dur-standard 250ms</code></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Card / sheet spring</span><code style="font-family:var(--font-mono);color:var(--text-secondary)">--ease-spring</code></div>
</div><div style="margin-top:12px;font-size:var(--text-caption);color:var(--text-secondary)">All durations collapse to 0 under prefers-reduced-motion.</div></body></html>
