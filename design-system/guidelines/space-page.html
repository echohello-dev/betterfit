<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Page rhythm</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body><div style="background:var(--bg-page);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px 20px;position:relative">
<div style="position:absolute;left:0;top:0;bottom:0;width:20px;background:var(--accent-surface)"></div>
<div style="position:absolute;right:0;top:0;bottom:0;width:20px;background:var(--accent-surface)"></div>
<div class="bf-label" style="margin-bottom:12px">Today's workout</div>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:16px"><div style="font-family:var(--font-display);font-size:22px">Push A</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px">6 exercises · 48 min</div></div>
</div></body></html>
