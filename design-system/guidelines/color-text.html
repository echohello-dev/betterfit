<!-- @dsCard group="Colors" viewport="700x160" name="Text colors" subtitle="Primary, secondary, tertiary, on-accent, on-identity" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Text colors</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:stretch">
<div style="flex:1;min-width:150px"><div style="font-size:var(--text-title-3);font-weight:700">Primary</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-primary #FFFFFF</code></div>
<div style="flex:1;min-width:150px"><div style="font-size:var(--text-title-3);font-weight:700;color:var(--text-secondary)">Secondary</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-secondary #9C9CA6</code></div>
<div style="flex:1;min-width:150px"><div style="font-size:var(--text-title-3);font-weight:700;color:var(--text-tertiary)">Tertiary</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-tertiary #63636D</code></div>
<div style="flex:1;min-width:130px;background:var(--accent);border-radius:var(--radius-md);padding:10px"><div style="font-size:var(--text-title-3);font-weight:700;color:var(--bf-black)">On accent</div><code style="font-family:var(--font-mono);font-size:10px;color:rgba(0,0,0,.6)">--text-on-accent #000</code></div>
<div style="flex:1;min-width:130px"><div style="font-size:var(--text-title-3);font-weight:700;color:var(--accent-text)">Accent text</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--accent-text</code></div>
</div></body></html>
