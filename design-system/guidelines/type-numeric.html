<!-- @dsCard group="Type" viewport="700x200" name="Numeric & timers" subtitle="Tabular figures so changing values never jitter" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Numeric</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body><div style="display:flex;gap:32px;align-items:flex-end;font-variant-numeric:tabular-nums">
<div><div style="font-family:var(--font-mono);font-size:40px;font-weight:700">01:24</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-timer 40</code></div>
<div><div style="font-size:28px;font-weight:700">225 lb</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-stat-lg 28</code></div>
<div><div style="font-size:20px;font-weight:700">18.4k</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-stat-md 20</code></div>
<div><div style="font-size:15px;font-weight:600">72%</div><code style="font-family:var(--font-mono);font-size:10px;color:var(--text-secondary)">--text-stat-sm 15</code></div>
</div></body></html>
