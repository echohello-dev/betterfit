<!-- @dsCard group="Motion" viewport="700x170" name="Press states" subtitle="Opacity 0.85 and scale 0.985 on primary; 0.7 on secondary; 0.6 on ghost" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Press</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><style>body{padding:20px;font-family:var(--font-ui)}.g{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:96px;border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}.sw i{display:block;height:56px}.sw b{display:block;font-size:11px;font-weight:600;padding:8px 10px 2px}.sw code{display:block;font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);padding:0 10px 8px}</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div style="height:54px;padding:0 24px;background:var(--accent);border-radius:var(--radius-button);display:grid;place-items:center;color:var(--text-on-accent);font-weight:600">Rest</div>
<div style="height:54px;padding:0 24px;background:var(--accent);border-radius:var(--radius-button);display:grid;place-items:center;color:var(--text-on-accent);font-weight:600;opacity:.85;transform:scale(.985)">Pressed</div>
<div style="height:54px;padding:0 24px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-button);display:grid;place-items:center;font-weight:600;opacity:.7">Secondary pressed</div>
<div style="color:var(--accent-text);font-weight:600;font-size:15px;opacity:.6">Ghost pressed</div>
</div></body></html>
