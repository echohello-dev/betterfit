<!-- @dsCard group="iOS App" viewport="440x880" name="BetterFit iPhone app" subtitle="Click-through: plan, live session, body, targets, log, summary, search, profile, settings" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>BetterFit — iPhone app</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<script src="./image-slot.js"></script>
<style>body{margin:0;background:#08080a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 0 24px;font-family:var(--font-ui)}#root{display:flex;flex-direction:column;align-items:center;gap:16px}.picker{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:390px}.picker button{background:#17171b;border:1px solid rgba(255,255,255,.08);color:#9c9ca6;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-ui)}.picker button[data-on="1"]{background:#FFD60A;border-color:transparent;color:#000}.picker button:hover{color:#FFD60A}*::-webkit-scrollbar{display:none}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="./tweaks-panel.jsx"></script>
<script type="text/babel" src="./AppShell.jsx"></script>
<script type="text/babel" src="./SignInScreen.jsx"></script>
<script type="text/babel" src="./MyPlanScreen.jsx"></script>
<script type="text/babel" src="./AddExerciseSheet.jsx"></script>
<script type="text/babel" src="./SessionScreen.jsx"></script>

<script type="text/babel" src="./SummaryScreen.jsx"></script>
<script type="text/babel" src="./BodyScreen.jsx"></script>
<script type="text/babel" src="./TargetsScreen.jsx"></script>
<script type="text/babel" src="./LogScreen.jsx"></script>
<script type="text/babel" src="./SearchScreen.jsx"></script>
<script type="text/babel" src="./ProfileScreen.jsx"></script>
<script type="text/babel" src="./SettingsScreen.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "chrome": "glass",
  "density": "roomy",
  "accent": "balanced",
  "artwork": "photo"
}/*EDITMODE-END*/;

function App(){
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [authed,setAuthed]=React.useState(true);
  const [tab,setTab]=React.useState('workout');
  const [modal,setModal]=React.useState(null);
  const [scheme,setScheme]=React.useState('dark');
  const [back,setBack]=React.useState(null);
  const [added,setAdded]=React.useState([]);
  const go=(t)=>{setAuthed(true);setModal(null);setTab(t)};
  const open=(m)=>{setAuthed(true);setModal(m)};

  let screen;
  const planNames=(window.BF_PLAN_EXERCISES||[]);
  const inPlan=[...planNames,...added];
  if(!authed) screen=<SignInScreen onSignIn={()=>setAuthed(true)} onGuest={()=>setAuthed(true)} />;
  else if(modal==='add') screen=<AddExerciseSheet inPlan={inPlan} onClose={()=>setModal(back)} onAdd={(picks)=>{setAdded(a=>[...a,...picks.filter(p=>!inPlan.includes(p))]);setModal(back)}} />;
  else if(modal==='session') screen=<SessionScreen onClose={()=>setModal(null)} onFinish={()=>setModal('summary')} onAddExercise={()=>{setBack('session');setModal('add')}} />;
  else if(modal==='summary') screen=<SummaryScreen onBack={()=>setModal(null)} onAddExercise={()=>{setBack('summary');setModal('add')}} />;
  else if(modal==='settings') screen=<SettingsScreen onBack={()=>setModal(null)} scheme={scheme} onScheme={setScheme} />;
  else if(modal==='search') screen=<SearchScreen />;
  else if(modal==='me') screen=<ProfileScreen onSettings={()=>setModal('settings')} />;
  else if(tab==='workout') screen=<MyPlanScreen onStart={()=>setModal('session')} onAddExercise={()=>{setBack(null);setModal('add')}} added={added} />;
  else if(tab==='body') screen=<BodyScreen />;
  else if(tab==='targets') screen=<TargetsScreen />;
  else screen=<LogScreen onOpenSummary={()=>setModal('summary')} onAddExercise={()=>{setBack(null);setModal('add')}} />;

  const chrome = authed && !modal;
  const jumps=[['Plan',()=>go('workout')],['Body',()=>go('body')],['Targets',()=>go('targets')],['Log',()=>go('log')],
    ['Live session',()=>open('session')],['Summary',()=>open('summary')],['Add exercise',()=>{setBack(null);open('add')}],
    ['Search',()=>open('search')],['Me',()=>open('me')],
    ['Settings',()=>open('settings')],['Sign in',()=>{setAuthed(false);setModal(null)}]];

  return (<>
    <Phone scheme={scheme} tweaks={t}>
      <ScreenBoundary screenKey={(modal||tab)+String(authed)}>{screen}</ScreenBoundary>
      {chrome && <TabBar active={tab} onChange={(id)=>{setTab(id);setModal(null)}} />}
    </Phone>
    <div className="picker">
      {jumps.map(([label,fn])=>(<button key={label} type="button" onClick={fn}>{label}</button>))}
      <button type="button" data-on="1" onClick={()=>setScheme(s=>s==='dark'?'light':'dark')}>{scheme==='dark'?'Light mode':'Dark mode'}</button>
    </div>
    <TweaksPanel>
      <TweakSection label="Chrome" />
      <TweakRadio label="Navigation" value={t.chrome} options={['glass','solid','compact']}
        onChange={(v)=>setTweak('chrome',v)} />
      <TweakSection label="Ledger" />
      <TweakRadio label="Density" value={t.density} options={['roomy','standard','compact']}
        onChange={(v)=>setTweak('density',v)} />
      <TweakRadio label="Row art" value={t.artwork} options={['plain','icon','photo']}
        onChange={(v)=>setTweak('artwork',v)} />
      <TweakSection label="Yellow" />
      <TweakRadio label="Presence" value={t.accent} options={['restrained','balanced','bold']}
        onChange={(v)=>setTweak('accent',v)} />
    </TweaksPanel>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
