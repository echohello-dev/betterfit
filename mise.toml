[env]
_.file = ".env"

[tasks."supabase:start"]
run = """
echo "Starting local Supabase (PostgreSQL + Auth + Storage)..."
supabase start
echo ""
echo "✅ Local Supabase running!"
echo ""
echo "To set up .env with credentials, run: mise run supabase:env"
echo "Studio (database UI): http://127.0.0.1:54323"
echo "To stop: mise run supabase:stop"
"""

[tasks."supabase:stop"]
run = "supabase stop"

[tasks."supabase:status"]
run = "supabase status"

[tasks."supabase:reset"]
run = "supabase db reset"
description = "Reset database and run all migrations"

[tasks."supabase:migrate"]
run = "supabase migration up"
description = "Apply pending migrations to local database"

[tasks."supabase:env"]
run = "bash scripts/setup_local_env.sh"
description = "Populate .env with local Supabase credentials"

[tasks."supabase:configure"]
run = """
bash scripts/setup_local_env.sh
cd Apps/iOS && xcodegen generate
bash ../../scripts/update_scheme_env.sh
echo ""
echo "✨ All done! Open the project with: mise run ios:open"
echo "   Credentials are loaded from .env (not committed to git)"
"""
description = "Full setup: populate .env, regenerate project, inject credentials into scheme"

[tasks.test]
run = """
bash scripts/exercise-video-pipeline/test_pipeline.sh
echo ""
echo '==> Swift tests'
swift test
"""

[tasks."pipeline:test"]
run = "bash scripts/exercise-video-pipeline/test_pipeline.sh"
description = "Smoke test the video pipeline scripts (syntax, override resolver, equipment spec coverage, prompt content, archive hygiene). Runs anywhere without FAL_KEY."

[tasks."pipeline:regen"]
run = "bash scripts/exercise-video-pipeline/generate.sh"
description = "Re-render all anchors and videos in scripts/exercise-video-pipeline/ using the current FAL_VIDEO_ENDPOINT (or FAL_VIDEO_OVERRIDES for per-slug routing). Skips already-rendered outputs."

[tasks.build]
run = "swift build"

[tasks.lint]
run = """
swiftlint lint --config .swiftlint.yml
"""

[tasks."ios:gen"]
run = """
cd Apps/iOS && xcodegen generate
cd ../.. && bash scripts/update_scheme_env.sh 2>/dev/null || echo "⚠️  No .env found. Run 'mise run supabase:configure' for local Supabase setup."
"""

[tasks."ios:open"]
run = """
cd Apps/iOS && xcodegen generate
cd ../.. && bash scripts/update_scheme_env.sh 2>/dev/null || echo "⚠️  No .env found. Run 'mise run supabase:configure' for local Supabase setup."
cd Apps/iOS && open BetterFit.xcodeproj
"""

[tasks."ios:build:ci"]
run = """
cd Apps/iOS
xcodegen generate
xcodebuild -project BetterFit.xcodeproj -scheme BetterFit -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
"""
description = "Build iOS for CI without querying or booting CoreSimulator devices"

[tasks."watch:gen"]
run = "cd Apps/iOS && xcodegen generate"

[tasks."watch:open"]
run = "cd Apps/iOS && xcodegen generate && open BetterFit.xcodeproj"

[tasks."watch:build"]
run = """
cd Apps/iOS
xcodegen generate

UDID=$(python3 "$PWD/../../scripts/simctl_pick_udid.py" \
  --runtime "com.apple.CoreSimulator.SimRuntime.watchOS-11-2" \
  --prefer "Apple Watch Series 10 (46mm)" \
  --prefer "Apple Watch Series 10 (42mm)" \
  --prefer "Apple Watch Ultra 2 (49mm)" \
  --contains "Apple Watch" \
  --timeout-seconds 15) || { echo "Failed to query watchOS simulators. Try: mise run ios:sim:reset" >&2; exit 1; }

if [ -n "$UDID" ]; then
  xcodebuild -project BetterFit.xcodeproj -scheme BetterFitWatch -destination "id=$UDID" build
else
  xcodebuild -project BetterFit.xcodeproj -scheme BetterFitWatch -destination 'generic/platform=watchOS Simulator' build
fi
"""

[tasks."ios:build:prod"]
run = """
cd Apps/iOS
xcodegen generate

UDID=$(python3 "$PWD/../../scripts/simctl_pick_udid.py" \
  --runtime "com.apple.CoreSimulator.SimRuntime.iOS-26-2" \
  --prefer "iPhone 16" \
  --prefer "iPhone 16 Pro" \
  --prefer "iPhone 16 Plus" \
  --prefer "iPhone 16 Pro Max" \
  --contains "iPhone" \
  --timeout-seconds 15) || { echo "Failed to query simulators. Try: mise run ios:sim:reset" >&2; exit 1; }

if [ -n "$UDID" ]; then
  xcodebuild -project BetterFit.xcodeproj -scheme BetterFit -destination "id=$UDID" build
else
  xcodebuild -project BetterFit.xcodeproj -scheme BetterFit -destination 'generic/platform=iOS Simulator' build
fi
"""

[tasks."ios:build:dev"]
run = """
cd Apps/iOS
xcodegen generate

UDID=$(python3 "$PWD/../../scripts/simctl_pick_udid.py" \
  --runtime "com.apple.CoreSimulator.SimRuntime.iOS-26-2" \
  --prefer "iPhone 16" \
  --prefer "iPhone 16 Pro" \
  --prefer "iPhone 16 Plus" \
  --prefer "iPhone 16 Pro Max" \
  --contains "iPhone" \
  --timeout-seconds 15) || { echo "Failed to query simulators. Try: mise run ios:sim:reset" >&2; exit 1; }

if [ -n "$UDID" ]; then
  xcodebuild -project BetterFit.xcodeproj -scheme BetterFit -destination "id=$UDID" build
else
  xcodebuild -project BetterFit.xcodeproj -scheme BetterFit -destination 'generic/platform=iOS Simulator' build
fi
"""

[tasks."ios:test:ui"]
run = """
cd Apps/iOS
xcodegen generate

UDID=$(python3 "$PWD/../../scripts/simctl_pick_udid.py" \
  --runtime "com.apple.CoreSimulator.SimRuntime.iOS-26-2" \
  --prefer "iPhone 16" \
  --prefer "iPhone 16 Pro" \
  --prefer "iPhone 16 Plus" \
  --prefer "iPhone 16 Pro Max" \
  --contains "iPhone" \
  --timeout-seconds 15) || { echo "Failed to query simulators. Try: mise run ios:sim:reset" >&2; exit 1; }

if [ -n "$UDID" ]; then
  xcodebuild test -project BetterFit.xcodeproj -scheme BetterFit -destination "id=$UDID" -only-testing:BetterFitAppUITests
else
  xcodebuild test -project BetterFit.xcodeproj -scheme BetterFit -destination 'generic/platform=iOS Simulator' -only-testing:BetterFitAppUITests
fi
"""
description = "Run UI tests for adjust sets functionality"

[tasks."ios:sim:boot26"]
run = """
set -euo pipefail

UDID=$(python3 "$PWD/scripts/simctl_pick_udid.py" \
  --runtime "com.apple.CoreSimulator.SimRuntime.iOS-26-2" \
  --prefer "iPhone 16" \
  --prefer "iPhone 16 Pro" \
  --prefer "iPhone 16 Plus" \
  --prefer "iPhone 16 Pro Max" \
  --contains "iPhone" \
  --timeout-seconds 15) || { echo "Failed to query simulators. Try: mise run ios:sim:reset" >&2; exit 1; }

if [ -z "$UDID" ]; then
  echo "No iOS 26.2 simulator runtime/devices found. Install iOS 26.2 Simulator runtime in Xcode Settings > Platforms." >&2
  exit 1
fi

xcrun simctl boot "$UDID" 2>/dev/null || true
xcrun simctl bootstatus "$UDID" -b
open -a Simulator --args -CurrentDeviceUDID "$UDID"
"""

[tasks."ios:sim:reset"]
run = """
killall -9 Simulator 2>/dev/null || true
killall -9 CoreSimulatorService 2>/dev/null || true
killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
xcrun simctl shutdown all || true
"""

[tasks."watch:sim:boot"]
run = """
set -euo pipefail

IOS_UDID=$(python3 "$PWD/scripts/simctl_pick_udid.py" \
  --runtime "com.apple.CoreSimulator.SimRuntime.iOS-26-2" \
  --prefer "iPhone 16" \
  --prefer "iPhone 16 Pro" \
  --prefer "iPhone 16 Plus" \
  --prefer "iPhone 16 Pro Max" \
  --contains "iPhone" \
  --timeout-seconds 15) || { echo "Failed to query iOS simulators. Try: mise run ios:sim:reset" >&2; exit 1; }

WATCH_UDID=$(python3 "$PWD/scripts/simctl_pick_udid.py" \
  --runtime "com.apple.CoreSimulator.SimRuntime.watchOS-26-2" \
  --prefer "Apple Watch Series 10 (46mm)" \
  --prefer "Apple Watch Series 10 (42mm)" \
  --prefer "Apple Watch Ultra 2 (49mm)" \
  --contains "Apple Watch" \
  --timeout-seconds 15) || { echo "Failed to query watchOS simulators. Try: mise run ios:sim:reset" >&2; exit 1; }

if [ -z "$WATCH_UDID" ]; then
	echo "No watchOS 26.2 simulator runtime/devices found. Install watchOS Simulator runtime in Xcode Settings > Platforms." >&2
  exit 1
fi

if [ -n "$IOS_UDID" ]; then
  xcrun simctl boot "$IOS_UDID" 2>/dev/null || true
  xcrun simctl bootstatus "$IOS_UDID" -b
fi

xcrun simctl boot "$WATCH_UDID" 2>/dev/null || true
xcrun simctl bootstatus "$WATCH_UDID" -b
open -a Simulator --args -CurrentDeviceUDID "$WATCH_UDID"
"""

[tools]
supabase = "latest"
swiftlint = "latest"
